<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AccessPilot — evidence-backed accessibility audits with approved, re-tested repairs." />
    <title>AccessPilot</title>
    <script>
      // Light by default; a saved choice wins. Set before first paint so the theme never flashes.
      (function () {
        var t = "light";
        try { t = localStorage.getItem("accesspilot-theme") || "light"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
