<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact the scholarship office — AccessPilot Control Page</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Rungta Scholarship Portal</span>
  </header>
  <main class="content">
    <h1>Contact the scholarship office</h1>
    <img src="campus.svg" class="hero" alt="Students walking past the main academic block">
    <form onsubmit="return false">
      <div class="field">
        <label for="c-name">Your name</label>
        <input type="text" id="c-name" name="c-name" autocomplete="name">
      </div>
      <div class="field">
        <label for="c-email">Email address</label>
        <input type="email" id="c-email" name="c-email" autocomplete="email">
      </div>
      <button type="submit">Send message</button>
    </form>
    <p><a href="#rules">Read the scholarship eligibility rules</a></p>
  </main>
</body>
</html>
